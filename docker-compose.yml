services:
  ebs:
    build: ./packages/ebs
    ports:
      - "8091:8081"
    volumes:
      - ./packages/ebs:/app
      - ebs_node_modules:/app/node_modules
    env_file:
      - ./packages/ebs/.env
    command: npm run dev

  extension:
    build: ./packages/extension
    ports:
      - "8090:8080"
    volumes:
      - ./packages/extension:/app
      - extension_node_modules:/app/node_modules
    command: npm run dev

# Named volumes for node_modules: without these, the bind mounts above would
# overwrite the container's installed node_modules with whatever's (or isn't)
# on your host, which is not what you want.
volumes:
  ebs_node_modules:
  extension_node_modules:
